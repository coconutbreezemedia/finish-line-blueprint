<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071a24" />
  <title>Fit Bitch</title>
  <meta name="description" content="Fit Bitch — a bold, surf-flavored training app for Hyrox + a Sprint Triathlon, built around a low-impact ramp and daily foot care." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23071a24' stroke='%2316c2b3' stroke-width='2'/><circle cx='16' cy='17' r='7' fill='%23ff8c42'/><rect x='6' y='17' width='20' height='1.6' fill='%23071a24'/><path d='M5 22 q4 -3 8 0 t8 0 t8 0' stroke='%2316c2b3' stroke-width='1.6' fill='none'/></svg>" />
  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fit Bitch" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- Top bar -->
    <header class="topbar">
      <div class="brand" id="brand"><!-- logo lockup injected by JS --></div>
      <button class="icon-btn" id="open-settings" aria-label="Settings"><!-- gear --></button>
    </header>

    <!-- Hero: race countdown + season progress -->
    <section class="hero" id="hero"><!-- rendered by JS --></section>

    <!-- Tabs -->
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab is-active" data-panel="today" role="tab">Today</button>
      <button class="tab" data-panel="plan" role="tab">Plan</button>
      <button class="tab" data-panel="foot" role="tab">Foot</button>
      <button class="tab" data-panel="log" role="tab">Log</button>
      <button class="tab" data-panel="info" role="tab">Info</button>
    </nav>

    <main class="panels">
      <section class="panel is-active" id="panel-today" role="tabpanel"></section>
      <section class="panel" id="panel-plan" role="tabpanel"></section>
      <section class="panel" id="panel-foot" role="tabpanel"></section>
      <section class="panel" id="panel-log" role="tabpanel"></section>
      <section class="panel" id="panel-info" role="tabpanel"></section>
    </main>

    <footer class="foot-note">
      <p>Not medical advice. Get cleared before Day 1 and stop on sharp pain.</p>
      <p class="foot-credit">Built with Coconut Breeze Media</p>
    </footer>
  </div>

  <!-- Settings / Connect drawer -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Settings">
    <div class="drawer__head">
      <h2>Settings &amp; Sync</h2>
      <button class="icon-btn" id="close-settings" aria-label="Close"><!-- close --></button>
    </div>
    <div class="drawer__body" id="drawer-body"><!-- rendered by JS --></div>
  </aside>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <!-- Login gate -->
  <div class="login" id="login" hidden>
    <div class="login__card">
      <div class="login__badge" id="login-badge"><!-- badge injected --></div>
      <p class="login__eyebrow">Salt life · est. 2026</p>
      <p class="login__sub">Enter your access key to log in and sync.</p>
      <input class="input login__input" id="login-input" type="password" autocomplete="current-password" placeholder="access key" />
      <button class="btn btn--primary login__go" id="login-go">Let's ride</button>
      <p class="login__err" id="login-err" hidden></p>
      <button class="login__skip" id="login-skip">Use offline, without syncing</button>
    </div>
  </div>

  <script src="plan.js"></script>
  <script src="icons.js"></script>
  <script src="backend.js"></script>
  <script src="app.js"></script>
</body>
</html>
